# PrometheusRule for the TEE-V2 prometheus-multi-tenant-proxy.
#
# This is the shippable alerting artifact. It is authored HERE but is deployed by
# the separate `ethos-core-prometheus-multi-tenant-proxy` Helm chart: drop the
# spec.groups body below into a chart templates/ file (the chart injects the
# operator's ruleSelector label, e.g. `release`/`prometheus`, and can template
# the `for`/`severity` values). The rule bodies are mirrored, byte-for-byte, in
# deploy/alerts/rules.yaml so that `promtool test rules` can validate them
# (promtool cannot parse this CRD wrapper directly).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: prometheus-multi-tenant-proxy
  namespace: monitoring
  labels:
    app.kubernetes.io/instance: prometheus-multi-tenant-proxy
    app.kubernetes.io/name: prometheus-multi-tenant-proxy
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: prometheus-multi-tenant-system
    role: alert-rules
spec:
  groups:
    - name: teev2-proxy-collection-health
      rules:
        # PRIMARY silent-stall signal (proxy_tenant_collection_up metric).
        # proxy_tenant_collection_up is only emitted for tenants that currently
        # have an enabled remote-write job, so `== 0` already implies
        # an onboarded tenant -- no extra "onboarded" guard is needed. max by keeps
        # only the identifying (namespace,name) labels and collapses per-replica
        # series (the proxy runs with multiple replicas + leader election).
        - alert: TEEV2ProxyTenantCollectionStalled
          expr: max by (namespace, name) (proxy_tenant_collection_up) == 0
          for: 15m
          labels:
            severity: warning
            service: prometheus-multi-tenant-proxy
            team: ethos-core
          annotations:
            summary: "TEE-V2 proxy tenant collection silently stalled ({{ $labels.namespace }}/{{ $labels.name }})"
            description: "Per-tenant remote-write collection for MetricAccess {{ $labels.namespace }}/{{ $labels.name }} has reported proxy_tenant_collection_up=0 for 15m. The tenant is onboarded (the metric only exists for tenants with an enabled remote-write job) but no series are being collected or forwarded - a silent stall."
            runbook: "Workaround: kubectl -n monitoring rollout restart deploy/prometheus-multi-tenant-proxy."

        # FALLBACK / corroborating signal for old images mid-rollout that predate
        # the proxy_tenant_collection_up metric. `up` is the per-target
        # scrape health series. This MUST be scoped to THIS proxy's own targets:
        # a bare `up == 0` (or `up{metrics_path!=""} == 0`) matches essentially
        # every scrape target in the Prometheus and would fire for unrelated
        # cluster-wide down targets, mislabeled as this proxy.
        # The proxy is deployed as Deployment/Service `prometheus-multi-tenant-proxy`
        # in namespace `monitoring` (see deploy/kubernetes/enhanced-deployment-ready.yaml),
        # scraped via pod prometheus.io/scrape annotations. There is no ServiceMonitor
        # in-repo, so the `job` label is not fixed here: adjust the selector below to
        # match your ServiceMonitor's/scrape-config's job label for this proxy.
        # This is coarser (target-down, not per-tenant stall) and is kept strictly
        # SECONDARY -- prefer TEEV2ProxyTenantCollectionStalled once every replica
        # emits proxy_tenant_collection_up.
        - alert: TEEV2ProxyTargetDown
          expr: up{job=~".*prometheus-multi-tenant-proxy.*"} == 0
          for: 15m
          labels:
            severity: warning
            service: prometheus-multi-tenant-proxy
            team: ethos-core
          annotations:
            summary: "TEE-V2 proxy scrape target down (fallback for images predating proxy_tenant_collection_up)"
            description: "A prometheus-multi-tenant-proxy scrape target {{ $labels.namespace }}/{{ $labels.job }} (instance {{ $labels.instance }}) has been down for 15m. Scoped to this proxy's own targets. Corroborating fallback for images that predate proxy_tenant_collection_up; confirm the primary metric before acting."
            runbook: "Workaround: kubectl -n monitoring rollout restart deploy/prometheus-multi-tenant-proxy."

        # SECONDARY self-heal churn signals (informational). A steadily increasing
        # restart or per-tenant stall-recreation count means the proxy is papering
        # over a recurring stall -- worth investigating even if the primary alert
        # is currently clear.
        #
        # Detection is based on pod container RESTARTS from kube-state-metrics, a
        # persistent, external signal. NOTE: the in-process proxy_self_restart_total
        # counter is best-effort only -- it is incremented and then the process
        # immediately os.Exit(1)s, so it lives in-memory and is wiped by the very
        # restart it counts (resets to 0). increase(proxy_self_restart_total[1h]) > 0
        # would therefore almost never catch a real self-restart, so it is NOT the
        # primary signal. Adjust the namespace/pod selector to match this proxy's
        # Deployment (default: Deployment `prometheus-multi-tenant-proxy` in
        # namespace `monitoring`).
        - alert: TEEV2ProxySelfRestartChurn
          expr: increase(kube_pod_container_status_restarts_total{namespace="monitoring", pod=~"prometheus-multi-tenant-proxy.*"}[1h]) > 0
          for: 5m
          labels:
            severity: info
            service: prometheus-multi-tenant-proxy
            team: ethos-core
          annotations:
            summary: "TEE-V2 proxy pod restarted in the last hour (possible self-heal churn)"
            description: "prometheus-multi-tenant-proxy pod {{ $labels.namespace }}/{{ $labels.pod }} restarted in the last hour (kube_pod_container_status_restarts_total). Recurring last-resort restarts indicate a persistent underlying stall. The in-process proxy_self_restart_total counter is best-effort (wiped by the restart it counts) and not the primary signal."

        - alert: TEEV2ProxyTenantStallRecreationChurn
          expr: increase(proxy_tenant_stall_recreations_total[1h]) > 0
          for: 5m
          labels:
            severity: info
            service: prometheus-multi-tenant-proxy
            team: ethos-core
          annotations:
            summary: "TEE-V2 proxy self-healed a stalled tenant job ({{ $labels.namespace }}/{{ $labels.name }})"
            description: "proxy_tenant_stall_recreations_total for {{ $labels.namespace }}/{{ $labels.name }} increased in the last hour; the self-heal watchdog is recreating a repeatedly-stalling collection job."
